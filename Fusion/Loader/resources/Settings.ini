# Fusion Kernel Configuration
# This file should be placed at: /data/Fusion/Settings.ini on the PS4
#
# This file is read by the Fusion loader before the kernel module is loaded.
# Features can be enabled/disabled by changing the values below.
# Values: true/false, 1/0, yes/no

[Features]
# ========== Core Features ==========

# Homebrew Support (FakePkgs + FakeSelf)
# Allows loading of unsigned/fake packages and executables
# Default: true
Homebrew = true

# Kernel Driver (/dev/Fusion)
# Creates device driver for userspace communication
# Required for many tools and plugins
# Default: true
Driver = true

# Fuse Filesystem
# Enables FUSE filesystem support
# Default: true
Fuse = true

# Fatal Trap Hooks
# Enhanced kernel panic reporting with stack traces
# Default: true
TrapHooks = true

# ========== Additional Features ==========

# JIT (Just-In-Time Compilation)
# Enables JIT compilation support for ShellUI
# Default: false
Jit = false

# Extended Logging
# Enhanced logging capabilities
# Default: true
ExtendedLogging = true

# Bootstrapper
# Bootstrapper functionality
# Default: true
Bootstrapper = true

# Direct Memory
# Direct memory access support
# Default: true
DirectMemory = true

# Dev Activation Spoofer
# Spoofs developer activation status
# Default: true
DevActSpoofer = true

# DIP Switch Spoofer
# Spoofs DIP switch settings
# Default: true
DipSwitchSpoofer = true

# Library Replacer
# Library replacement functionality
# Default: true
LibraryReplacer = true

# TTY Redirector
# TTY redirection support
# Default: false
TTYRedirect = false

[Advanced]
# Direct memory reservation (in pages)
# Default: 300
DirectMemoryPages = 300
